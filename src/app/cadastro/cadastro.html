<h1>Cadastro de Clientes</h1>

<form [formGroup]="formulario">
<!-- está ligado ao formulário que criei no cadastro.ts -->

  <label>Nome:</label>
   <!--conectei o campo nome ao type OBS:mesma coisa aconteçe nas próximas linhas -->
  <input type="text" formControlName="nome">
  <!--mostrar a mensagem de obrigatorio-->
  @if (formulario.controls.nome.invalid && formulario.controls.nome.touched) {
    <p>O nome é obrigatório.</p>
  }
  
  <label>E-mail:</label>
  <input type="email" formControlName="email">

  <label>CPF:</label>
  <input type="text" formControlName="cpf">

  <label>Data de nascimento:</label>
  <input type="date" formControlName="dataNascimento">

  <label>UF:</label>
  <input type="text" formControlName="uf">

  <label>Município:</label>
  <input type="text" formControlName="municipio">

  <button type="button" (click)="cadastrar()">Cadastrar</button>
  <!--1 criei o botão e depois apaguei e refiz para ele funcionar-->
</form>





































<input
  type="date"
  name="dataNascimento"
  id="dataNascimento"
  [(ngModel)]="dataNascimento"
  class="elem-form-02"
  required
>


<!-- Campo de seleção do estado (UF). -->
<label for="uf">UF</label>

<!-- Lista de estados disponíveis. -->
<select name="uf" id="uf" [(ngModel)]="uf" class="elem-form-02">

  <option value="">
    Selecione uma UF
  </option>

  @for (elem of listaUFs; track elem.id) {
    <option [ngValue]="elem">
      {{elem.sigla}} - {{elem.nome}}
    </option>
  }

</select>


<!-- Campo de seleção da cidade. -->
<label for="municipio">Município</label>

<!-- Lista de cidades disponíveis. -->
<select name="municipio" id="municipio" [(ngModel)]="municipio"
  [disabled]="listaMunicipios.length === 0"
  class="elem-form-02">

  <option value="Aracaju">
    Aracaju
  </option>
